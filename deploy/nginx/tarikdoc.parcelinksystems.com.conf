# Vhost nginx de l'hôte — WathiqaDoc / TarikDoc
# Installation :
#   sudo cp deploy/nginx/tarikdoc.parcelinksystems.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/tarikdoc.parcelinksystems.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tarikdoc.parcelinksystems.com     # ajoute le bloc HTTPS
#
# Les conteneurs n'écoutent que sur 127.0.0.1 (voir docker-compose.yml / deploy.sh).

server {
    listen 80;
    listen [::]:80;
    server_name tarikdoc.parcelinksystems.com;

    # Audio base64 (30 s max) + formulaires admin.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API FastAPI (borne et back-office l'appellent en relatif).
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }

    # Back-office (Vite, base /admin/) : le préfixe est retiré avant le conteneur.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:3101/;
    }

    # Borne citoyenne (Next.js).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# WathiqaDoc — déploiement multi-services (CDC §10, PROMPT 13)
# Usage : cp .env.example .env && docker compose up -d --build
#
# Les ports sont liés à BIND_ADDR (127.0.0.1 par défaut) : Docker contourne ufw, un port
# publié sur 0.0.0.0 serait exposé sur Internet. L'accès public passe par un reverse proxy.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: wathiqadoc
      POSTGRES_USER: ${DB_USER:-wathiqa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis}
    healthcheck:
      # -h 127.0.0.1 : le port TCP n'ouvre qu'après les scripts d'initialisation (migrations).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-wathiqa} -d wathiqadoc"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-wathiqa}:${DB_PASSWORD}@postgres:5432/wathiqadoc
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Vide = appels relatifs /api, proxifiés par la borne vers le service api.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_KIOSK_MODE: "true"
        NEXT_PUBLIC_BORNE_ID: ${BORNE_ID:-borne-01}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BORNE_PORT:-3000}:3000"

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_PORT:-3001}:3001"

volumes:
  pgdata:
  qdrant_storage:
  redis_data:
